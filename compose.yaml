
name: opspulse

services:

  # 1. OpsPulse FastAPI application
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: opspulse-api:1.0

    environment:
      OTEL_SERVICE_NAME: opspulse-api
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces

    ports:
      - "127.0.0.1:8001:8000"

    restart: unless-stopped
    init: true
    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    depends_on:
      jaeger:
        condition: service_started

    networks:
      - opspulse


  # 2. Prometheus metrics collection
  prometheus:
    image: prom/prometheus:v3.16.0

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    networks:
      - opspulse
  # Alertmanager: receives and manages Prometheus alerts
  alertmanager:
    image: prom/alertmanager:v0.35.0

    ports:
      - "127.0.0.1:9093:9093"

    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

    restart: unless-stopped

    networks:
      - opspulse

  # 3. Grafana dashboards and visualization
  grafana:
    image: grafana/grafana:13.3.0

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus
      - loki

    restart: unless-stopped

    networks:
      - opspulse


  # 4. Loki centralized log storage
  loki:
    image: grafana/loki:3.6.20

    command:
      - "-config.file=/etc/loki/loki-config.yaml"

    ports:
      - "127.0.0.1:3100:3100"

    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki

    restart: unless-stopped

    networks:
      - opspulse


  # 5. Grafana Alloy log collection
  alloy:
    image: grafana/alloy:v1.21.3

    command:
      - run
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - /etc/alloy/config.alloy

    ports:
      - "127.0.0.1:12345:12345"

    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data

    depends_on:
      - loki

    restart: unless-stopped

    networks:
      - opspulse


  # 6. Jaeger distributed tracing
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0

    ports:
      - "127.0.0.1:16686:16686"

    restart: unless-stopped

    networks:
      - opspulse
  
  # 7. Linux host monitoring
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1

    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"

    volumes:
      - /:/host:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

    restart: unless-stopped

    networks:
      - opspulse


# Shared internal Docker network
networks:
  opspulse:
    driver: bridge


# Persistent storage volumes
volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  alertmanager_data:
