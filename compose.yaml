
name: opspulse

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: opspulse-api:1.0

    ports:
      - "127.0.0.1:8001:8000"

    restart: unless-stopped
    init: true
    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - opspulse

  prometheus:
    image: prom/prometheus:v3.16.0

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    networks:
      - opspulse

networks:
  opspulse:
    driver: bridge

volumes:
  prometheus_data:
