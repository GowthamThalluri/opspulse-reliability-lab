
name: opspulse

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: opspulse-api:1.0

    ports:
      - "127.0.0.1:8001:8000"

    restart: unless-stopped

    init: true

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - opspulse

networks:
  opspulse:
    driver: bridge
